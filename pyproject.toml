[project]
name = "figures4papers"
version = "0.1.0"
description = "Publication-quality matplotlib helpers extracted from the figures4papers scripts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.23",
]

[project.optional-dependencies]
# Only needed by some of the original figure_* scripts, not by the library itself.
scripts = ["scipy", "seaborn", "python-dateutil"]

[dependency-groups]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/figures4papers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
